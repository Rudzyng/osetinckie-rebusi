{% extends "base.html" %}

{% block title %}Угадайте букву{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-info text-white text-center">
                <h4>Что изображено?</h4>
            </div>
            <div class="card-body text-center">
                <img src="{{ url_for('static', filename='images/rebus/' + folder_name + '/' + image_filename) }}"
                     class="img-fluid mb-3" style="max-height: 250px;">

                <div class="alert alert-info mt-2">
                    <strong>Подсказка:</strong> {{ word_disc }}
                </div>

                <input type="text" id="answer" class="form-control form-control-lg text-center"
                       placeholder="Ваш ответ" autocomplete="off">
                <button id="check-btn" class="btn btn-primary btn-lg mt-3">Проверить</button>
                <div id="result" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const checkBtn = document.getElementById('check-btn');
    const answerInput = document.getElementById('answer');
    const resultDiv = document.getElementById('result');
    const position = {{ position }};
    const rebusId = {{ rebus_id }};

    console.log('Страница буквы:', {rebusId, position});

    async function checkAnswer() {
        const userAnswer = answerInput.value.trim();

        if (!userAnswer) {
            resultDiv.innerHTML = '<div class="alert alert-warning">Введите ответ!</div>';
            return;
        }

        console.log('Отправка проверки:', {rebusId, position, userAnswer});

        const response = await fetch('/check_letter', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                rebus_id: rebusId,
                position: position,
                answer: userAnswer
            })
        });

        const data = await response.json();
        console.log('Ответ сервера:', data);

        if (data.success) {
            resultDiv.innerHTML = `<div class="alert alert-success">✅ Правильно! Буква "${data.letter}" добавлена в ребус.</div>`;
            setTimeout(() => window.location.href = `/rebus/${rebusId}`, 1500);
        } else {
            resultDiv.innerHTML = `<div class="alert alert-danger">❌ ${data.message || 'Неправильно, попробуйте ещё раз'}</div>`;
        }
    }

    checkBtn.addEventListener('click', checkAnswer);
    answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') checkAnswer();
    });
</script>
{% endblock %}
