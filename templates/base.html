<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"/>
    <title>{% block title %}Решатор ребусов{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
<div class="phone-container">
    <div class="phone-notch"></div>

    <div class="app-header">
        <h1>Осетинские ребусы</h1>
    </div>

    <div class="app-nav">
        <div class="dropdown">
            <button class="nav-link dropdown-toggle" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-grid-fill"></i> Меню
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="{{ url_for('profile') }}">
                    <i class="bi bi-person-fill"></i> Профиль
                </a></li>
                {% if not session.get('is_guest') %}
                <li><a class="dropdown-item" href="{{ url_for('create_rebus_page') }}">
                    <i class="bi bi-plus-square-fill"></i> Создать ребус
                </a></li>
                {% endif %}
                <li><a class="dropdown-item" href="{{ url_for('how_to_play') }}">
                    <i class="bi bi-book-fill"></i> Как играть
                </a></li>
                <li>
                    <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item" href="{{ url_for('leaderboard') }}">
                    <i class="bi bi-trophy-fill"></i> Лидерборд
                </a></li>
                <li><a class="dropdown-item" href="{{ url_for('logout') }}">
                    <i class="bi bi-box-arrow-right"></i> Выйти
                </a></li>
            </ul>
        </div>
        <a href="{{ url_for('index') }}" class="nav-link">
            <i class="bi bi-house-fill"></i> Главная
        </a>
    </div>

    <div class="app-content">
        {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
