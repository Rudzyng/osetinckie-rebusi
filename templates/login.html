{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow text-center">
            <div class="card-body py-5">
                <i class="bi bi-box-arrow-in-right display-1 text-primary"></i>
                <h1 class="mt-3">Вход в игру</h1>

                {% if error %}
                <div class="alert alert-danger mt-3">
                    {{ error.message }}
                </div>
                {% endif %}

                <form method="POST" class="mt-4" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <input type="email" name="email" class="form-control form-control-lg"
                               placeholder="Email" required>
                    </div>

                    <div class="mb-4">
                        <input type="password" name="password" class="form-control form-control-lg"
                               placeholder="Пароль" required>
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-100">
                        <i class="bi bi-box-arrow-in-right"></i> Войти
                    </button>
                </form>

                <form method="POST" class="mt-3" action="{{ url_for('guest_login') }}">
                    <button type="submit" class="btn btn-secondary btn-lg w-100">
                        <i class="bi bi-person"></i> Войти как гость
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
