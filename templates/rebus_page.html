{% extends "base.html" %}

{% block title %}Ребус{% endblock %}

{% block content %}
<div class="rebus-grid">
    {% for cell in cells %}
    <div class="rebus-cell">
        <div class="cell-image">
            <img src="{{ url_for('static', filename='images/rebus/' + folder_name + '/' + cell.image) }}"
                 alt="подсказка" onerror="this.src='https://via.placeholder.com/100'">
        </div>
        <div class="cell-letter">
            <a href="{{ url_for('cell_page', rebus_id=rebus_id, position=cell.position) }}" class="{{ 'filled-letter' if cell.filled else 'btn-empty-cell' }}">
                {{ cell.display_letter if cell.filled else '❓' }}
            </a>
        </div>
    </div>
    {% endfor %}
</div>

<div class="text-center mt-3">
    <div class="progress mx-auto" style="height: 8px; max-width: 250px;">
        <div class="progress-bar" style="width: {{ (filled_count / total_count * 100) if total_count > 0 else 0 }}%"></div>
    </div>
    <small class="text-muted">{{ filled_count }} из {{ total_count }}</small>
</div>

{% if all_filled %}
<div class="card mt-3">
    <div class="card-body">
        <form id="final-word-form">
            <div class="mb-3">
                <label class="form-label fw-bold">Русский перевод:</label>
                <input type="text" id="ru-word-input" class="form-control" placeholder="Введите перевод" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Проверить ребус</button>
            <button id="continue-to-profile" class="btn btn-primary w-100 mt-2" style="display: none;">Продолжить</button>
            <div id="final-result" class="mt-3"></div>
        </form>
    </div>
</div>
{% endif %}

<script>
    const form = document.getElementById('final-word-form');
    if (form) {
        form.addEventListener('submit', async e => {
            e.preventDefault();
            const input = document.getElementById('ru-word-input');
            const word = input.value.trim().toLowerCase();
            if (!word) {
                document.getElementById('final-result').innerHTML = '<div class="alert alert-warning">⚠️ Введите перевод!</div>';
                return;
            }
            const res = await fetch('{{ url_for("check_final_word") }}', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ rebus_id: {{ rebus_id }}, ru_word: word })
            });
            const data = await res.json();
            const resultDiv = document.getElementById('final-result');
            if (data.success) {
                resultDiv.innerHTML = `<div class="alert alert-success">✅ ${data.message}<br>+1 ребус, +{{ total_count }} слов(а)!</div>`;
                form.querySelector('button[type="submit"]').style.display = 'none';
                document.getElementById('continue-to-profile').style.display = 'block';
                input.disabled = true;
            } else {
                resultDiv.innerHTML = `<div class="alert alert-danger">❌ ${data.message}</div>`;
            }
        });
        document.getElementById('continue-to-profile')?.addEventListener('click', () => {
            window.location.href = '{{ url_for("profile") }}';
        });
    }
</script>
{% endblock %}
