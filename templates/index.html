{% extends "base.html" %}

{% block title %}Главная{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-lg text-center">
            <div class="card-body py-5">
                <i class="bi bi-puzzle-fill display-1 text-primary mb-3"></i>
                <h1 class="display-4 fw-bold">Мейн страница</h1>
                <p class="lead text-muted">Добро пожаловать в мир увлекательных ребусов!</p>
                <hr class="my-4">

                <div class="mb-4">
                    <label class="form-label fw-bold fs-5">Выберите тему:</label>
                    <div class="d-flex justify-content-center gap-3 mt-2">
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="theme" id="theme1" value="space" checked>
                            <label class="form-check-label fs-5" for="theme1">
                                🚀 Космос
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="theme" id="theme2" value="animals">
                            <label class="form-check-label fs-5" for="theme2">
                                🐱 Животные
                            </label>
                        </div>
                    </div>
                </div>

                <a href="/rebus/<theme_id>" id="start-btn" class="btn btn-primary btn-lg px-5 mt-3">
                    <i class="bi bi-play-fill me-2"></i>Начать решать
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock %}
