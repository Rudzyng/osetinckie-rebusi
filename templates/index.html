{% extends "base.html" %}

{% block title %}Выбор темы{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow text-center">
            <div class="card-body py-5">
                <i class="bi bi-puzzle-fill display-1 text-primary"></i>
                <h1 class="mt-3">Выберите тему</h1>
                    <div class="d-flex justify-content-center">
                        <div class="list-group mt-4 w-75">  <!-- w-75 = 75% ширины -->
                            {% for theme in themes %}
                            <a href="{{ url_for('theme_page', theme_id=theme.id) }}" class="list-group-item list-group-item-action">
                                {% if theme.name == 'Семья' %}👨‍👩‍👧
                                {% elif theme.name == 'Дружба' %}👨🏿‍🤝‍👨🏾
                                {% else %}🧩
                                {% endif %} {{ theme.name }}
                            </a>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
{% endblock %}
