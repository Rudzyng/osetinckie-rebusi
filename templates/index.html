{% extends "base.html" %}

{% block title %}Выбор темы{% endblock %}

{% block content %}
<div class="theme-grid">
    {% for theme in themes %}
    <a href="{{ url_for('theme_page', theme_id=theme.id) }}" class="theme-card">
        <div class="theme-icon">
            {% if theme.name == 'Семья' %}👨‍👩‍👧
            {% elif theme.name == 'Дружба' %}🤝
            {% else %}🧩
            {% endif %}
        </div>
        <div class="theme-name">{{ theme.name }}</div>
        <div class="theme-arrow">→</div>
    </a>
    {% endfor %}
</div>
{% endblock %}
