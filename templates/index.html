{% extends "base.html" %}

{% block title %}Главная{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card border-0 shadow-lg text-center">
            <div class="card-body py-5">
                <i class="bi bi-puzzle-fill display-1 text-primary mb-3"></i>
                <h1 class="display-4 fw-bold">Мейн страница</h1>
                <p class="lead text-muted">Добро пожаловать в мир увлекательных ребусов!</p>
                <hr class="my-4">

                <div class="dropdown-center mb-4">
                    <button class="btn btn-secondary btn-lg dropdown-toggle px-5" type="button" id="themesDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-grid-3x3-gap-fill me-2"></i>Темы
                    </button>
                    <ul class="dropdown-menu dropdown-menu-dark" aria-labelledby="themesDropdown">
                        <li><a class="dropdown-item" href="/rebus/space">🚀 Космос</a></li>
                        <li><a class="dropdown-item" href="/rebus/animals">🐱 Животные</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
